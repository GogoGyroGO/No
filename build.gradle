plugins {
 id 'fabric-loom' version '1.6.12'
 id 'maven-publish'
}
version = '1.0.0'
group = 'dev.gyro'
base { archivesName = 'gyro-spin' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.15.11'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

test { useJUnitPlatform() }

// Integration tests run in a real, headless Minecraft server, outside the release jar.
sourceSets {
 gametest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 }
}
loom {
 mods {
  gyrospin { sourceSet sourceSets.main }
  gyrospin_tests { sourceSet sourceSets.gametest }
 }
 runs {
  gametest {
   server()
   name 'Spin integration tests'
   source sourceSets.gametest
   runDir 'build/gametest'
   vmArg '-Dfabric-api.gametest'
   vmArg '-Dfabric-api.gametest.report-file=results/spin-gametest-results.xml'
  }
 }
}
